name: sweeep
description: Sweeep — on-device photo and video cleaner. No AI, no uploads.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  drift: ^2.19.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.3
  path: ^1.9.0
  ffi: ^2.1.2
  google_fonts: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.19.0
  pigeon: ^29.0.10

flutter:
  uses-material-design: true
