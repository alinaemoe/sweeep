org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Distribution switch (no UI for it). false = Play-safe build: every delete goes
# through the system confirmation dialog. true = sideload build that also
# declares MANAGE_EXTERNAL_STORAGE ("All files access") and deletes without the
# dialog once that is granted. Google Play does not allow this permission for a
# cleaner app, so never ship `true` to the store.
sweeep.directDelete=false

# plugin sources live on another drive (pub cache); incremental Kotlin caches cannot span drives on Windows
kotlin.incremental=false
